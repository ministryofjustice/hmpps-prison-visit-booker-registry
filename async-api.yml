asyncapi: 3.0.0
info:
  title: Visit Booker Registry
  description: Publishes events relating to visit bookers (for the public visit service)
  version: 1.0.0

servers:
  development:
    host: hmpps-domain-events-dev.live-1.cloud-platform.service.justice.gov.uk
    protocol: sqs
    description: Development environment
  preproduction:
    host: hmpps-domain-events-preprod.live-1.cloud-platform.service.justice.gov.uk
    protocol: sqs
    description: Pre-production environment
  production:
    host: hmpps-domain-events-prod.live-1.cloud-platform.service.justice.gov.uk
    protocol: sqs
    description: Production environment

components:
  messages:
    prison-visit-booker.visitor-linked:
      contentType: application/json
      name: prison-visit-booker.visitor-linked
      payload:
        properties:
          additionalInformation:
            properties:
              bookerReference:
                example: abc-def-ghi
                type: string
              prisonerId:
                example: AA123456
                type: string
              visitorId:
                example: 123456
                type: string
            type: object
          description:
            example: Booker's prisoner has a visitor linked.
            type: string
          detailUrl:
            example: null
            type: string
          eventType:
            example: prison-visit-booker.visitor-linked
            type: string
          occurredAt:
            example: '2024-05-01T19:28:58Z'
            type: string
          personReference:
            properties:
              identifiers:
                items:
                - properties:
                    type:
                      example: NOMIS
                      type: string
                    value:
                      example: A5276DZ
                      type: string
                  type: object
                type: array
            type: object
          version:
            example: 1
            type: integer
        type: object
      summary: An event to signify a booker's prisoner has a visitor linked by hmpps-prison-visit-booker-registry
      title: prison-visit-booker.visitor-linked
    prison-visit-booker.visitor-request-approved:
      contentType: application/json
      name: prison-visit-booker.visitor-request-approved
      payload:
        properties:
          additionalInformation:
            properties:
              requestReference:
                example: abc-def-ghi
                type: string
            type: object
          description:
            example: Booker's prisoner has a visitor request approved.
            type: string
          detailUrl:
            example: null
            type: string
          eventType:
            example: prison-visit-booker.visitor-request-approved
            type: string
          occurredAt:
            example: '2024-05-01T19:28:58Z'
            type: string
          personReference:
            properties:
              identifiers:
                items:
                - properties:
                    type:
                      example: NOMIS
                      type: string
                    value:
                      example: A5276DZ
                      type: string
                  type: object
                type: array
            type: object
          version:
            example: 1
            type: integer
        type: object
      summary: An event to signify a booker's prisoner has a visitor request approved by hmpps-prison-visit-booker-registry
      title: prison-visit-booker.visitor-request-approved
    prison-visit-booker.visitor-request-rejected:
      contentType: application/json
      name: prison-visit-booker.visitor-request-rejected
      payload:
        properties:
          additionalInformation:
            properties:
              requestReference:
                example: abc-def-ghi
                type: string
            type: object
          description:
            example: Booker's prisoner has a visitor request rejected.
            type: string
          detailUrl:
            example: null
            type: string
          eventType:
            example: prison-visit-booker.visitor-request-rejected
            type: string
          occurredAt:
            example: '2024-05-01T19:28:58Z'
            type: string
          personReference:
            properties:
              identifiers:
                items:
                - properties:
                    type:
                      example: NOMIS
                      type: string
                    value:
                      example: A5276DZ
                      type: string
                  type: object
                type: array
            type: object
          version:
            example: 1
            type: integer
        type: object
      summary: An event to signify a booker's prisoner has a visitor request rejected by hmpps-prison-visit-booker-registry
      title: prison-visit-booker.visitor-request-rejected

channels:
  hmpps-domain-events:
    description: HMPPS domain events SNS topic
    bindings:
      sns:
        name: domainevents
    messages:
      prison-visit-booker.visitor-linked:
        $ref: '#/components/messages/prison-visit-booker.visitor-linked'
      prison-visit-booker.visitor-request-approved:
        $ref: '#/components/messages/prison-visit-booker.visitor-request-approved'
      prison-visit-booker.visitor-request-rejected:
        $ref: '#/components/messages/prison-visit-booker.visitor-request-rejected'

operations:
  publish-event:
    action: send
    channel:
      $ref: '#/channels/hmpps-domain-events'
    messages:
      - $ref: '#/channels/hmpps-domain-events/messages/prison-visit-booker.visitor-linked'
      - $ref: '#/channels/hmpps-domain-events/messages/prison-visit-booker.visitor-request-approved'
      - $ref: '#/channels/hmpps-domain-events/messages/prison-visit-booker.visitor-request-rejected'
